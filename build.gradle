plugins {
    id 'java'
}

group = 'com.blackmarker'
version = '1.1'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'

    // Bundled into the jar (see jar task below) so the extension is a single file.
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // Swing classes are instantiated by a few tests; never require a display.
    systemProperty 'java.awt.headless', 'true'
}

jar {
    archiveBaseName = 'BlackMarker'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Implementation-Title': 'BlackMarker',
            'Implementation-Version': project.version
        )
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
