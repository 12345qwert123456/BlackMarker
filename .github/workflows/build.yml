name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test jar --no-daemon

      - name: Check that Gson is bundled
        run: unzip -l build/libs/BlackMarker-*.jar | grep -q 'com/google/gson/Gson.class'

      - uses: actions/upload-artifact@v4
        with:
          name: BlackMarker
          path: build/libs/BlackMarker-*.jar
          if-no-files-found: error

  release:
    # Publishes the jar as a GitHub release when a tag like v1.1 is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlackMarker

      - uses: softprops/action-gh-release@v2
        with:
          files: BlackMarker-*.jar
          generate_release_notes: true
